name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:macos
      - uses: actions/upload-artifact@v4
        with:
          name: Bieltructor-macOS
          path: build/Bieltructor.app

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install xcodegen
      - run: npm ci
      - run: npm run build:ios
      - run: xcodebuild -project Bieltructor.xcodeproj -scheme Bieltructor-macOS -configuration Release -derivedDataPath build/mac-derived CODE_SIGNING_ALLOWED=NO build
